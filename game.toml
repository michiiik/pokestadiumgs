# Pokemon Stadium 2 (US)
# N64Recomp input generated from pret/pokestadiumgs commit c0e10f23.

[input]
entrypoint = 0x80000400
rom_file_path = "baserom.z64"
elf_path = "disasm/build/pokestadiumgs-us.elf"
output_func_path = "generated"
relocatable_sections_path = "fragments_relocatable.txt"
bss_section_suffix = "_bss"
single_file_output = false
functions_per_output_file = 50
# Every fragment begins with an 8-byte header trampoline (a J to the fragment's
# real entry, plus its delay slot). N64Recomp does not disassemble the textbin
# header, so without a manual declaration there is no function at offset 0 and
# the game's call into a freshly loaded fragment misses func_map. The lookup-miss
# handler logs and RETURNS WITHOUT EXECUTING, so the fragment's init silently
# never runs and any callback slot it was supposed to fill stays NULL — which is
# how the battle aborted on a 0x00000000 function pointer.
# Verified: all 88 fragments have opcode 2 (J) at offset 0. Same approach Stadium
# 1 uses (it declares 77 of these).
manual_funcs = [
    { name = "func_8007BE88", section = ".text", vram = 0x8007BE88, size = 0x28 },
    { name = "fragment1_entry", section = ".fragment1", vram = 0x83500000, size = 0x8 },
