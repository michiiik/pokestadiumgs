# Pokemon Stadium 2 (US) audio microcode.
#
# Stadium 2 does NOT ship Stadium 1's aspMain: none of Stadium 1's ucode bytes
# occur in this ROM, and the DMEM dispatch header differs entirely. Running
# Stadium 1's recompiled aspMain against Stadium 2 command lists made its
# handlers compute RDRAM addresses from the wrong ABI and corrupt unrelated
# memory, so M_AUDTASK was temporarily routed to a no-op. This is the real
# thing, recompiled from this ROM.
#
# The combined blob is rspboot + aspMain so that aspMain's absolute J/JAL
# targets into rspboot helpers resolve; see tools/build_ps2_aspmain.py.
#   rspboot: ROM[0x000B70..0x000BF0]  -> IMEM[0x000..0x080]
#   aspMain: ROM[0x001060..0x002060]  -> IMEM[0x080..0x1080]
text_offset = 0
text_size = 0x1080
text_address = 0x04001000
rom_file_path = "aspmain_combined_ps2.bin"
output_file_path = "rsp/aspMain_ps2.cpp"
output_function_name = "aspMain_ps2"

# Audio-command handler PCs, read from ucode_data (ROM 0x87AF0) halfwords
# +0x10..+0x3E. The dispatch loop reaches them with `jr`, so static analysis
# cannot see them and they must be declared or every handler call is an
# "Unhandled jump target".
extra_indirect_branch_targets = [
    0x1F80, 0x1250, 0x1154, 0x1094, 0x1E0C, 0x1514, 0x1E7C, 0x1C90,
    0x1180, 0x1808, 0x11E8, 0x1ADC, 0x1B6C, 0x1194, 0x1EF8, 0x1240,
    0x17C0, 0x186C, 0x1A58, 0x18BC, 0x1ABC, 0x1ACC, 0x1A80, 0x1BD4,
]
