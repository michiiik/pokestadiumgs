name: Public PR ROM Gate

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Public PR number to validate using its GitHub merge ref
        required: false

      ref:
        description: Same-repository branch or SHA when no PR number is supplied
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: public-pr-rom-gate-${{ github.event.pull_request.number || inputs.pr_number || inputs.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Validate ROM against master
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    # This label is intentionally different from the private repository's
    # gs-decomp label. Register it only on a dedicated, credential-free Mac
    # runner after the public baseline image has been built.
    runs-on: [self-hosted, macOS, ARM64, gs-decomp-public]
    timeout-minutes: 30
    steps:
      - name: Mask self-hosted runner paths
        shell: bash
        run: |
          echo "::add-mask::${HOME}"
          echo "::add-mask::${GITHUB_WORKSPACE}"
          echo "::add-mask::${RUNNER_TEMP}"

      - name: Checkout the PR merge ref or selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || inputs.ref }}
          persist-credentials: false
          set-safe-directory: false

      - name: Detect a coverage-only push
        id: coverage-only
        # The integration workflow pushes a "ci: update coverage for #N"
        # commit straight to the PR branch once this gate passes, touching
        # only COVERAGE.md. That push re-triggers this same workflow via
        # `synchronize`, redoing the full build for a file with no effect
        # on the ROM. Detect that specific case and skip the rebuild --
        # the job still runs and reports a real status either way, so a
        # required-status-check on this workflow is never left pending.
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin "${{ github.event.before }}" "${{ github.event.after }}"
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}")"
          if [ "$changed" = "COVERAGE.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "pr-rom-gate: push only updated COVERAGE.md; skipping the full rebuild" >&2
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and compare against the retail checksum
        if: steps.coverage-only.outputs.skip != 'true'
        shell: bash
        run: bash ci/gate-pr.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pokestadiumgs-gate-out"

      - name: Upload gate and proposed coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pr-rom-gate-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
          path: ${{ runner.temp }}/pokestadiumgs-gate-out/
          if-no-files-found: warn
          retention-days: 14
